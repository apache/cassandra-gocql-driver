name: Build

on:
  push:
    branches:
      - trunk
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.25', '1.26']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Run linting
        run: make check
      - name: Run unit tests
        run: make test-unit

  integration-cassandra:
    name: Integration Tests
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
        cassandra_version: ['4.1.6', '5.0.3']
        compressor: ['no-compression', 'snappy', 'lz4']
        proto_version: ['4', '5']
        exclude:
          - proto_version: '5'
            compressor: 'snappy'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Integration tests
        env:
          CASSANDRA_VERSION: ${{ matrix.cassandra_version }}
          TEST_CQL_PROTOCOL: ${{ matrix.proto_version }}
          TEST_COMPRESSOR: ${{ matrix.compressor }}
          TEST_INTEGRATION_TAGS: integration cassandra tc
        run: make test-integration
      - name: Docker state on failure
        if: failure()
        run: |
          docker ps -a
          docker network ls

  integration-auth-cassandra:
    name: Integration Tests with auth
    needs:
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26']
        cassandra_version: ['4.1.6']
        compressor: ['no-compression', 'snappy', 'lz4']
        proto_version: ['4', '5']
        exclude:
          - proto_version: '5'
            compressor: 'snappy'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
      - name: Integration tests
        env:
          CASSANDRA_VERSION: ${{ matrix.cassandra_version }}
          TEST_CQL_PROTOCOL: ${{ matrix.proto_version }}
          TEST_COMPRESSOR: ${{ matrix.compressor }}
          TEST_INTEGRATION_TAGS: integration cassandra tc
        run: make test-integration-auth
      - name: Docker state on failure
        if: failure()
        run: |
          docker ps -a
          docker network ls
